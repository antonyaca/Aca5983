name: Diagnostic sources
on: workflow_dispatch
permissions:
  contents: write
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester les sources
        run: |
          mkdir -p logs
          {
          for u in \
            "https://datafeed.dukascopy.com/datafeed/XAUUSD/2026/08/05/10h_ticks.bi5" \
            "https://datafeed.dukascopy.com/datafeed/EURUSD/2025/00/06/BID_candles_min_1.bi5" \
            "https://www.histdata.com/download-free-forex-historical-data/?/ascii/1-minute-bar-quotes/xauusd/2025" \
            "https://query1.finance.yahoo.com/v8/finance/chart/GC=F?interval=1m&range=5d" \
            "https://stooq.com/q/d/l/?s=xauusd&i=d"; do
            echo "== $u"
            curl -s -o /tmp/out -D - -m 30 -A "Mozilla/5.0" "$u" | head -12
            echo "taille: $(wc -c < /tmp/out)"
          done
          } > logs/diag.log 2>&1
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add logs && git commit -m "Diagnostic sources" && git push
